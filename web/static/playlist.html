<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой плейлист</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/style.css?v=__ASSET_V__">
</head>
<body>

    <div id="headerEl" class="header">
        <div class="header-top">
            <h1>🎵 Мой плейлист</h1>
            <span class="track-counter" id="trackCount">0 треков</span>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="Поиск по названию или автору...">
    </div>

    <div id="trackList" class="track-list">
        <div class="empty-state">Загрузка плейлиста...</div>
    </div>

    <div id="playerBar" class="player-bar">
        <div class="progress-container">
            <span id="currentTime" class="time-label">0:00</span>
            <div id="seekWrapper" class="seek-wrapper">
                <div class="seek-track">
                    <div id="seekFill" class="seek-fill"></div>
                </div>
                <div id="seekThumb" class="seek-thumb"></div>
                <input type="range" id="seekSlider" class="seek-slider" min="0" max="100" value="0" step="0.01">
            </div>
            <span id="totalTime" class="time-label">0:00</span>
        </div>
        <div class="player-main">
            <div class="player-track" id="playerTrackTrigger" title="Открыть плеер">
                <img id="playerCover" class="player-cover" src="" alt="" onerror="this.style.visibility='hidden'">
                <div class="player-meta">
                    <div id="playerTitle" class="player-title marquee"><span class="marquee-inner">Выберите трек</span></div>
                    <div id="playerArtist" class="player-artist">—</div>
                </div>
            </div>
            <div class="player-controls">
                <button class="ctrl-btn" id="prevBtn" title="Предыдущий">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn play-pause" id="playPauseBtn" title="Воспроизвести / Пауза">
                    <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="ctrl-btn" id="nextBtn" title="Следующий">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button class="ctrl-btn" id="repeatBtn" title="Повтор трека">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="fullPlayer" class="full-player" aria-hidden="true">
        <div class="fp-bg">
            <div class="fp-bg-blur-layer">
                <img id="fpBgImgA" class="fp-bg-img" src="" alt="">
                <img id="fpBgImgB" class="fp-bg-img" src="" alt="">
            </div>
        </div>
        <div class="fp-content">
            <div>
                <div class="fp-handle"></div>
                <div class="fp-topbar">
                    <button class="fp-collapse-btn" id="fpCollapseBtn" title="Свернуть">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
                    </button>
                    <span class="fp-header-label">Сейчас играет</span>
                    <div class="fp-topbar-spacer"></div>
                </div>
            </div>

            <div class="fp-art-wrap">
                <div id="fpArtBox" class="fp-art-box">
                    <span id="fpCoverFallback" class="fp-art-fallback">🎵</span>
                    <img id="fpCoverA" src="" alt="">
                    <img id="fpCoverB" src="" alt="">
                </div>
            </div>

            <div>
                <div class="fp-meta">
                    <div id="fpTitle" class="fp-title marquee"><span class="marquee-inner">Выберите трек</span></div>
                    <div id="fpArtist" class="fp-artist marquee"><span class="marquee-inner">—</span></div>
                </div>

                <div class="fp-progress">
                    <div id="fpSeekWrapper" class="seek-wrapper">
                        <div class="seek-track">
                            <div id="fpSeekFill" class="seek-fill"></div>
                        </div>
                        <div id="fpSeekThumb" class="seek-thumb"></div>
                        <input type="range" id="fpSeekSlider" class="seek-slider" min="0" max="100" value="0" step="0.01">
                    </div>
                    <div class="fp-times">
                        <span id="fpCurrentTime" class="time-label">0:00</span>
                        <span id="fpTotalTime" class="time-label">0:00</span>
                    </div>
                </div>

                <div class="fp-controls">
                    <button class="fp-ctrl-btn" id="fpShuffleBtn" title="Перемешать">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                    </button>
                    <button class="fp-ctrl-btn" id="fpPrevBtn" title="Предыдущий">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="fp-ctrl-btn play-pause" id="fpPlayPauseBtn" title="Воспроизвести / Пауза">
                        <svg id="fpPlayIcon" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="fpPauseIcon" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="fp-ctrl-btn" id="fpNextBtn" title="Следующий">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                    <button class="fp-ctrl-btn" id="fpRepeatBtn" title="Повтор трека">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <button id="scrollTopBtn" class="scroll-top-btn" type="button" title="Наверх" aria-label="Наверх">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
    </button>

    <div id="undoToast" class="undo-toast" role="status" aria-live="polite">
        <span id="undoToastText" class="undo-toast-text">Трек удалён</span>
        <button id="undoDeleteBtn" class="undo-toast-btn" type="button">Отменить</button>
    </div>

    <audio id="audioElement" preload="metadata"></audio>

    <script src="/static/app.js?v=__ASSET_V__"></script>
</body>
</html>
