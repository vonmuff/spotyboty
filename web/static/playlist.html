<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой плейлист</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: var(--tg-theme-bg-color, #0f0f13);
            --bg-card: var(--tg-theme-secondary-bg-color, #18181f);
            --bg-card-hover: color-mix(in srgb, var(--bg-card) 86%, var(--text-primary) 14%);
            --accent: #1db954;
            --accent-hover: #1ed760;
            --text-primary: var(--tg-theme-text-color, #ffffff);
            --text-secondary: var(--tg-theme-hint-color, #9ca3af);
            --danger: var(--tg-theme-destructive-text-color, #ef4444);
            --border-subtle: color-mix(in srgb, var(--text-primary) 9%, transparent);
            --surface-chip: color-mix(in srgb, var(--text-primary) 7%, transparent);
            --surface-chip-hover: color-mix(in srgb, var(--text-primary) 14%, transparent);
            --header-bg: color-mix(in srgb, var(--bg-main) 88%, transparent);
            --player-bar-bg: color-mix(in srgb, var(--bg-card) 94%, transparent);
            --track-bg: color-mix(in srgb, var(--text-primary) 18%, transparent);
            --thumb-bg: var(--text-primary);
            --bar-shadow: rgba(0, 0, 0, 0.35);
        }

        :root[data-theme="light"] {
            --bar-shadow: rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        img {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 155px;
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--header-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 16px 16px 12px;
            border-bottom: 1px solid var(--border-subtle);
            transition: padding 0.22s ease, box-shadow 0.25s ease, backdrop-filter 0.25s ease;
        }

        .header.scrolled {
            padding: 11px 16px 10px;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 8px 24px var(--bar-shadow);
        }

        .scroll-top-btn {
            position: fixed;
            right: 16px;
            bottom: 22px;
            z-index: 18;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--border-subtle);
            background: var(--player-bar-bg);
            color: var(--text-primary);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 6px 20px var(--bar-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transform: translateY(14px) scale(0.88);
            pointer-events: none;
            transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), bottom 0.25s ease, background 0.2s ease;
        }

        body.has-player .scroll-top-btn {
            bottom: 138px;
        }

        .scroll-top-btn.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .scroll-top-btn:active {
            transform: scale(0.92);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .track-counter {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--surface-chip);
            padding: 4px 10px;
            border-radius: 99px;
        }

        .search-box {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent);
        }

        .track-list {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            border: 1px solid var(--border-subtle);
        }

        .track-item:active {
            transform: scale(0.99);
        }

        .track-item.active {
            background: rgba(29, 185, 84, 0.12);
            border-color: rgba(29, 185, 84, 0.4);
        }

        .track-item.entering {
            opacity: 0;
            animation: cardEnter 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: calc(var(--enter-idx, 0) * 28ms);
        }

        .track-item.restoring {
            animation: cardRestore 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .track-item.removing {
            opacity: 0;
            transform: translateX(-28px);
            max-height: 0 !important;
            padding-top: 0;
            padding-bottom: 0;
            margin-top: -8px;
            border-width: 0;
            overflow: hidden;
            pointer-events: none;
            transition:
                opacity 0.2s ease,
                transform 0.22s cubic-bezier(0.4, 0, 0.2, 1),
                max-height 0.22s cubic-bezier(0.4, 0, 0.2, 1),
                padding 0.22s ease,
                margin 0.22s ease;
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardRestore {
            from {
                opacity: 0;
                transform: translateX(-18px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .cover-wrapper {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--surface-chip-hover), var(--bg-card));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-fallback {
            font-size: 22px;
            user-select: none;
        }

        /* ===== Animated Equalizer on Active Track ===== */
        .eq-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.52);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            pointer-events: none;
        }

        .eq-overlay span {
            width: 3px;
            height: 16px;
            border-radius: 2px;
            background: var(--accent);
            transform-origin: bottom;
            animation: eqBounce 0.7s ease-in-out infinite alternate;
        }

        .eq-overlay span:nth-child(1) {
            animation-duration: 0.62s;
            animation-delay: 0s;
        }

        .eq-overlay span:nth-child(2) {
            animation-duration: 0.48s;
            animation-delay: -0.25s;
        }

        .eq-overlay span:nth-child(3) {
            animation-duration: 0.74s;
            animation-delay: -0.45s;
        }

        .eq-overlay.paused span {
            animation-play-state: paused;
            transform: scaleY(0.32);
        }

        @keyframes eqBounce {
            0% { transform: scaleY(0.25); }
            100% { transform: scaleY(1); }
        }

        /* ===== Skeleton Loading ===== */
        .skeleton-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border-subtle);
            pointer-events: none;
        }

        .skeleton-shimmer {
            background: linear-gradient(
                90deg,
                var(--surface-chip) 25%,
                var(--surface-chip-hover) 50%,
                var(--surface-chip) 75%
            );
            background-size: 200% 100%;
            animation: skeletonWave 1.3s ease-in-out infinite;
        }

        .skeleton-cover {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .skeleton-meta {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .skeleton-line {
            height: 12px;
            border-radius: 6px;
        }

        .skeleton-line.title {
            width: 66%;
            height: 14px;
        }

        .skeleton-line.artist {
            width: 42%;
        }

        .skeleton-actions {
            display: flex;
            gap: 6px;
        }

        .skeleton-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
        }

        @keyframes skeletonWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== Undo Delete Toast ===== */
        .undo-toast {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 20px;
            max-width: 440px;
            margin: 0 auto;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(24, 24, 31, 0.96);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(14px);
            transform: translateY(140%);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease, bottom 0.25s ease;
        }

        body.has-player .undo-toast {
            bottom: 136px;
        }

        .undo-toast.visible {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .undo-toast-text {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .undo-toast-btn {
            background: rgba(29, 185, 84, 0.18);
            border: none;
            color: var(--accent-hover);
            font-size: 13px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 99px;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s ease;
        }

        .undo-toast-btn:active {
            background: rgba(29, 185, 84, 0.32);
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .track-item.active .track-title {
            color: var(--accent);
        }

        .track-artist {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: var(--surface-chip);
            border: none;
            color: var(--text-secondary);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .icon-btn:hover {
            background: var(--surface-chip-hover);
            color: var(--text-primary);
        }

        .icon-btn.delete:hover {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-secondary);
        }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--player-bar-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-subtle);
            padding: 12px 16px 18px;
            z-index: 20;
            box-shadow: 0 -8px 30px var(--bar-shadow);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .player-bar.visible {
            transform: translateY(0);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .time-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            min-width: 34px;
        }

        .time-label:last-child {
            text-align: right;
        }

        .seek-wrapper {
            position: relative;
            flex: 1;
            height: 24px;
            display: flex;
            align-items: center;
            touch-action: none;
        }

        .seek-track {
            position: relative;
            width: 100%;
            height: 5px;
            border-radius: 999px;
            background: var(--track-bg);
            overflow: hidden;
            transition: height 0.15s ease;
        }

        .seek-wrapper:hover .seek-track,
        .seek-wrapper.seeking .seek-track {
            height: 7px;
        }

        .seek-fill {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            box-shadow: 0 0 8px rgba(29, 185, 84, 0.45);
            will-change: width;
        }

        .seek-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--thumb-bg);
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
            transform: translate(-50%, -50%) scale(0.85);
            pointer-events: none;
            transition: transform 0.15s ease;
            will-change: left;
        }

        .seek-wrapper:hover .seek-thumb,
        .seek-wrapper.seeking .seek-thumb {
            transform: translate(-50%, -50%) scale(1.15);
        }

        .seek-slider {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            opacity: 0;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .player-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .player-track {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .player-cover {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            background: #2b2b36;
            flex-shrink: 0;
        }

        .player-meta {
            min-width: 0;
            flex: 1;
        }

        .player-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== Smooth Marquee for Long Titles ===== */
        .marquee {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: clip;
        }

        .marquee-inner {
            display: inline-block;
            will-change: transform;
        }

        .marquee.scrolling {
            -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
        }

        .marquee.scrolling .marquee-inner {
            padding-right: 14px;
            animation: marqueePingPong var(--marquee-duration, 10s) ease-in-out infinite;
        }

        @keyframes marqueePingPong {
            0%, 16% { transform: translateX(0); }
            56%, 72% { transform: translateX(var(--marquee-distance, 0px)); }
            100% { transform: translateX(0); }
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .ctrl-btn.play-pause {
            background: var(--accent);
            color: #000;
            width: 44px;
            height: 44px;
        }

        .ctrl-btn.active-mode {
            color: var(--accent);
        }

        .player-track {
            cursor: pointer;
        }

        /* ===== Fullscreen Player (Bottom Sheet) ===== */
        body.fp-open {
            overflow: hidden;
        }

        .full-player {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #0f0f13;
            color: #ffffff;
            --track-bg: rgba(255, 255, 255, 0.22);
            --thumb-bg: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 12px) 24px calc(env(safe-area-inset-bottom, 16px) + 18px);
            transform: translateY(100%);
            transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            overflow: hidden;
            touch-action: pan-x;
        }

        .full-player .time-label {
            color: rgba(255, 255, 255, 0.72);
        }

        .full-player.open {
            transform: translateY(0);
        }

        .full-player.dragging {
            transition: none;
        }

        .fp-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 50% 25%, #232333 0%, #0f0f13 75%);
        }

        .fp-bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(55px) saturate(1.65) brightness(0.42);
            transform: scale(1.42);
            opacity: 0;
            transition: opacity 0.45s ease;
            will-change: opacity;
        }

        .fp-bg-img.visible {
            opacity: 1;
        }

        .fp-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(15, 15, 19, 0.35) 0%,
                rgba(15, 15, 19, 0.55) 55%,
                rgba(15, 15, 19, 0.92) 100%
            );
        }

        .fp-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
        }

        .fp-handle {
            width: 40px;
            height: 4px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.28);
            margin: 6px auto 8px;
            flex-shrink: 0;
        }

        .fp-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .fp-collapse-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .fp-collapse-btn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .fp-header-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.72);
        }

        .fp-topbar-spacer {
            width: 38px;
        }

        .fp-art-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            padding: 8px 0 18px;
        }

        .fp-art-box {
            position: relative;
            width: min(78vw, 320px);
            max-height: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            background: linear-gradient(135deg, #2b2b38, #16161d);
            box-shadow: 0 22px 52px rgba(0, 0, 0, 0.58);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate3d(0, 0, 0) scale(0.92);
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease, box-shadow 0.35s ease;
            will-change: transform, opacity;
            touch-action: none;
            user-select: none;
        }

        .fp-art-box.playing {
            transform: translate3d(0, 0, 0) scale(1);
            box-shadow: 0 26px 60px rgba(0, 0, 0, 0.68);
        }

        .fp-art-box.swiping {
            transition: none !important;
        }

        .fp-art-box.swipe-out {
            transition: transform 0.17s cubic-bezier(0.4, 0, 1, 1), opacity 0.17s ease !important;
        }

        .fp-art-box img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.36s ease;
        }

        .fp-art-box img.visible {
            opacity: 1;
        }

        .fp-art-fallback {
            font-size: 72px;
            user-select: none;
            display: none;
        }

        .fp-meta {
            margin-bottom: 18px;
        }

        .fp-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .fp-artist {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.72);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fp-progress {
            margin-bottom: 18px;
        }

        .fp-progress .seek-wrapper {
            height: 28px;
        }

        .fp-progress .seek-track {
            height: 6px;
        }

        .fp-progress .seek-wrapper:hover .seek-track,
        .fp-progress .seek-wrapper.seeking .seek-track {
            height: 8px;
        }

        .fp-progress .seek-thumb {
            width: 14px;
            height: 14px;
        }

        .fp-times {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
        }

        .fp-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .fp-ctrl-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s ease, color 0.2s ease, background 0.2s ease;
        }

        .fp-ctrl-btn:active {
            transform: scale(0.92);
        }

        .fp-ctrl-btn.active-mode {
            color: var(--accent);
        }

        .fp-ctrl-btn.play-pause {
            width: 66px;
            height: 66px;
            background: var(--accent);
            color: #000;
            box-shadow: 0 8px 26px rgba(29, 185, 84, 0.42);
            transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease, box-shadow 0.3s ease;
        }

        .fp-ctrl-btn.play-pause.is-playing {
            animation: playGlow 2.4s ease-in-out infinite;
        }

        .fp-ctrl-btn.play-pause:active {
            transform: scale(0.9);
        }

        .fp-ctrl-btn.play-pause:hover {
            background: var(--accent-hover);
        }

        @keyframes playGlow {
            0%, 100% {
                box-shadow: 0 8px 24px rgba(29, 185, 84, 0.42), 0 0 0 0 rgba(29, 185, 84, 0.35);
            }
            50% {
                box-shadow: 0 10px 30px rgba(29, 185, 84, 0.58), 0 0 0 10px rgba(29, 185, 84, 0);
            }
        }
    </style>
</head>
<body>

                    <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>

            <div>
                <div class="fp-meta">

    </button>

    <div id="undoToast" class="undo-toast" role="status" aria-live="polite">
        <span id="undoToastText" class="undo-toast-text">Трек удалён</span>
        <button id="undoDeleteBtn" class="undo-toast-btn" type="button">Отменить</button>
    </div>

    <audio id="audioElement" preload="metadata"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function applyTelegramTheme() {
            const scheme = tg.colorScheme || 'dark';
            document.documentElement.dataset.theme = scheme;
            const bgColor = tg.themeParams?.bg_color || '#0f0f13';
            try {
                if (isFullPlayerOpen) {
                    tg.setHeaderColor?.('#0f0f13');
                    tg.setBackgroundColor?.('#0f0f13');
                } else {
                    tg.setHeaderColor?.(bgColor);
                    tg.setBackgroundColor?.(bgColor);
                }
            } catch (e) {}
        }

        const initData = tg.initData || '';
        const authHeaders = () => ({ 'X-Telegram-Init-Data': initData });

        let allTracks = [];
        let filteredTracks = [];
        let shuffledIds = [];
        let currentFileId = null;
        let isRepeat = false;
        let isShuffle = false;
        let isSeeking = false;
        let isFullPlayerOpen = false;

        function haptic(style = 'light') {
            try {
                tg.HapticFeedback?.impactOccurred(style);
            } catch (e) {}
        }

        function rebuildShuffleQueue() {
            const ids = filteredTracks.map(t => t.file_id);
            for (let i = ids.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [ids[i], ids[j]] = [ids[j], ids[i]];
            }
            if (currentFileId) {
                const idx = ids.indexOf(currentFileId);
                if (idx > 0) {
                    ids.splice(idx, 1);
                    ids.unshift(currentFileId);
                }
            }
            shuffledIds = ids;
        }

        function getActiveOrderIds() {
            if (isShuffle) {
                const validSet = new Set(filteredTracks.map(t => t.file_id));
                const cleaned = shuffledIds.filter(id => validSet.has(id));
                if (cleaned.length !== filteredTracks.length) {
                    rebuildShuffleQueue();
                    return shuffledIds;
                }
                return cleaned;
            }
            return filteredTracks.map(t => t.file_id);
        }

        function getCurrentIndex() {
            if (!currentFileId) return -1;
            return getActiveOrderIds().indexOf(currentFileId);
        }

        const audio = document.getElementById('audioElement');
        const headerEl = document.getElementById('headerEl');
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        const trackListEl = document.getElementById('trackList');
        const trackCountEl = document.getElementById('trackCount');
        const searchInput = document.getElementById('searchInput');
        const playerBar = document.getElementById('playerBar');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const playerCover = document.getElementById('playerCover');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const playerTrackTrigger = document.getElementById('playerTrackTrigger');
        const seekWrapper = document.getElementById('seekWrapper');
        const seekFill = document.getElementById('seekFill');
        const seekThumb = document.getElementById('seekThumb');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');

        const fullPlayer = document.getElementById('fullPlayer');
        const fpBgImgs = [document.getElementById('fpBgImgA'), document.getElementById('fpBgImgB')];
        const fpCollapseBtn = document.getElementById('fpCollapseBtn');
        const fpArtBox = document.getElementById('fpArtBox');
        const fpCovers = [document.getElementById('fpCoverA'), document.getElementById('fpCoverB')];
        const fpCoverFallback = document.getElementById('fpCoverFallback');
        let fpActiveLayer = 0;
        let fpCoverSeq = 0;
        const fpTitle = document.getElementById('fpTitle');
        const fpArtist = document.getElementById('fpArtist');
        const fpSeekWrapper = document.getElementById('fpSeekWrapper');
        const fpSeekFill = document.getElementById('fpSeekFill');
        const fpSeekThumb = document.getElementById('fpSeekThumb');
        const fpSeekSlider = document.getElementById('fpSeekSlider');
        const fpCurrentTime = document.getElementById('fpCurrentTime');
        const fpTotalTime = document.getElementById('fpTotalTime');
        const fpShuffleBtn = document.getElementById('fpShuffleBtn');
        const fpPrevBtn = document.getElementById('fpPrevBtn');
        const fpPlayPauseBtn = document.getElementById('fpPlayPauseBtn');
        const fpPlayIcon = document.getElementById('fpPlayIcon');
        const fpPauseIcon = document.getElementById('fpPauseIcon');
        const fpNextBtn = document.getElementById('fpNextBtn');
        const fpRepeatBtn = document.getElementById('fpRepeatBtn');
        const undoToast = document.getElementById('undoToast');
        const undoToastText = document.getElementById('undoToastText');
        const undoDeleteBtn = document.getElementById('undoDeleteBtn');

        let progressRafId = null;
        let pendingDelete = null;

        function setProgressVisual(current, duration) {
            const pct = duration > 0 ? Math.max(0, Math.min(100, (current / duration) * 100)) : 0;
            const formattedCurrent = formatTime(current);
            const formattedTotal = duration > 0 ? formatTime(duration) : '0:00';

            seekFill.style.width = `${pct}%`;
            seekThumb.style.left = `${pct}%`;
            currentTimeEl.textContent = formattedCurrent;
            totalTimeEl.textContent = formattedTotal;

            fpSeekFill.style.width = `${pct}%`;
            fpSeekThumb.style.left = `${pct}%`;
            fpCurrentTime.textContent = formattedCurrent;
            fpTotalTime.textContent = formattedTotal;

            if (duration > 0) {
                seekSlider.max = duration;
                fpSeekSlider.max = duration;
                if (!isSeeking) {
                    seekSlider.value = current;
                    fpSeekSlider.value = current;
                }
            }
        }

        function startProgressLoop() {
            if (progressRafId !== null) return;
            const tick = () => {
                if (!isSeeking && !audio.paused && audio.duration) {
                    setProgressVisual(audio.currentTime, audio.duration);
                }
                if (!audio.paused) {
                    progressRafId = requestAnimationFrame(tick);
                } else {
                    progressRafId = null;
                }
            };
            progressRafId = requestAnimationFrame(tick);
        }

        function stopProgressLoop() {
            if (progressRafId !== null) {
                cancelAnimationFrame(progressRafId);
                progressRafId = null;
            }
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function renderSkeleton(count = 6) {
            trackListEl.innerHTML = Array.from({ length: count }, () => `
                <div class="skeleton-item">
                    <div class="skeleton-cover skeleton-shimmer"></div>
                    <div class="skeleton-meta">
                        <div class="skeleton-line title skeleton-shimmer"></div>
                        <div class="skeleton-line artist skeleton-shimmer"></div>
                    </div>
                    <div class="skeleton-actions">
                        <div class="skeleton-circle skeleton-shimmer"></div>
                        <div class="skeleton-circle skeleton-shimmer"></div>
                    </div>
                </div>
            `).join('');
        }

        async function loadPlaylist() {
            if (!initData) {
                trackListEl.innerHTML = `<div class="empty-state">Откройте плейлист через кнопку в Telegram-боте.</div>`;
                return;
            }
            renderSkeleton(6);
            try {
                const res = await fetch('/api/playlist', { headers: authHeaders() });
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }
                const data = await res.json();
                allTracks = data.tracks || [];
                filteredTracks = [...allTracks];
                renderTracks({ animateEntrance: true });
            } catch (err) {
                trackListEl.innerHTML = `<div class="empty-state">Ошибка загрузки плейлиста</div>`;
            }
        }

        function renderTracks(options = {}) {
            const { animateEntrance = false, highlightFileId = null } = options;
            trackCountEl.textContent = `${allTracks.length} треков`;

            if (filteredTracks.length === 0) {
                trackListEl.innerHTML = `<div class="empty-state">Плейлист пуст 🎧</div>`;
                return;
            }

            trackListEl.innerHTML = '';
            const isPaused = audio.paused;
            filteredTracks.forEach((track, idx) => {
                const isCurrent = currentFileId !== null && currentFileId === track.file_id;
                const item = document.createElement('div');
                const classes = ['track-item'];
                if (isCurrent) classes.push('active');
                if (animateEntrance && idx < 14) {
                    classes.push('entering');
                    item.style.setProperty('--enter-idx', idx);
                }
                if (highlightFileId && track.file_id === highlightFileId) {
                    classes.push('restoring');
                }
                item.className = classes.join(' ');
                item.dataset.fileId = track.file_id;

                const coverUrl = track.cover_url;
                const eqHtml = isCurrent
                    ? `<div class="eq-overlay ${isPaused ? 'paused' : ''}"><span></span><span></span><span></span></div>`
                    : '';

                item.innerHTML = `
                    <div class="cover-wrapper">
                        <img src="${coverUrl}" alt="" loading="lazy"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <span class="cover-fallback" style="display:none;">🎵</span>
                        ${eqHtml}
                    </div>
                    <div class="track-info">
                        <div class="track-title">${escapeHtml(track.title || track.name)}</div>
                        <div class="track-artist">${escapeHtml(track.performer || 'Spotify')}</div>
                    </div>
                    <div class="track-actions">
                        <button class="icon-btn" title="Отправить в чат" data-action="send">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </button>
                        <button class="icon-btn delete" title="Удалить" data-action="delete">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                `;

                item.addEventListener('click', (e) => {
                    const btn = e.target.closest('button');
                    if (btn) {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                        if (action === 'send') sendToChat(track.file_id);
                        if (action === 'delete') deleteTrack(track.file_id);
                        return;
                    }
                    playTrackById(track.file_id);
                });

                trackListEl.appendChild(item);
            });
        }

        function setMarqueeText(el, text) {
            let inner = el.querySelector('.marquee-inner');
            if (!inner) {
                inner = document.createElement('span');
                inner.className = 'marquee-inner';
                el.textContent = '';
                el.appendChild(inner);
            }
            el.classList.remove('scrolling');
            el.style.removeProperty('--marquee-distance');
            el.style.removeProperty('--marquee-duration');
            inner.textContent = text;
            refreshMarquee(el);
        }

        function refreshMarquee(el) {
            const inner = el.querySelector('.marquee-inner');
            if (!inner) return;
            requestAnimationFrame(() => {
                const overflow = inner.scrollWidth - el.clientWidth;
                if (overflow > 4) {
                    const distance = -(overflow + 14);
                    const duration = Math.max(6, Math.min(18, (overflow / 32) + 4.5));
                    el.style.setProperty('--marquee-distance', `${distance}px`);
                    el.style.setProperty('--marquee-duration', `${duration.toFixed(1)}s`);
                    el.classList.add('scrolling');
                } else {
                    el.classList.remove('scrolling');
                }
            });
        }

        function refreshAllMarquees() {
            refreshMarquee(playerTitle);
            refreshMarquee(fpTitle);
            refreshMarquee(fpArtist);
        }

        window.addEventListener('resize', refreshAllMarquees);

        function openFullPlayer() {
            if (!currentFileId) return;
            isFullPlayerOpen = true;
            fullPlayer.style.transform = '';
            fullPlayer.classList.add('open');
            fullPlayer.setAttribute('aria-hidden', 'false');
            document.body.classList.add('fp-open');
            applyTelegramTheme();
            refreshAllMarquees();
            haptic('light');
            try {
                tg.BackButton?.show();
            } catch (e) {}
        }

        function closeFullPlayer() {
            if (!isFullPlayerOpen) return;
            isFullPlayerOpen = false;
            fullPlayer.style.transform = '';
            fullPlayer.classList.remove('open', 'dragging');
            fullPlayer.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('fp-open');
            applyTelegramTheme();
            try {
                tg.BackButton?.hide();
            } catch (e) {}
            scrollToActiveTrack();
        }

        applyTelegramTheme();
        try {
            tg.onEvent?.('themeChanged', applyTelegramTheme);
        } catch (e) {}

        try {
            tg.BackButton?.onClick(() => {
                if (isFullPlayerOpen) closeFullPlayer();
            });
        } catch (e) {}

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isFullPlayerOpen) {
                closeFullPlayer();
            }
        });

        function hideLayerInstantly(el) {
            el.style.transition = 'none';
            el.classList.remove('visible');
            void el.offsetWidth;
            el.style.transition = '';
        }

        function crossfadeFullPlayerCover(coverUrl, instantCover = false) {
            const seq = ++fpCoverSeq;
            const prevIdx = fpActiveLayer;
            const nextIdx = 1 - fpActiveLayer;

            const prevCover = fpCovers[prevIdx];
            const nextCover = fpCovers[nextIdx];
            const prevBg = fpBgImgs[prevIdx];
            const nextBg = fpBgImgs[nextIdx];

            prevCover.style.zIndex = '1';
            nextCover.style.zIndex = '2';
            prevBg.style.zIndex = '1';
            nextBg.style.zIndex = '2';

            hideLayerInstantly(nextCover);
            hideLayerInstantly(nextBg);

            const preload = new Image();
            preload.onload = () => {
                if (seq !== fpCoverSeq) return;
                fpCoverFallback.style.display = 'none';
                nextCover.src = coverUrl;
                nextBg.src = coverUrl;

                if (instantCover) {
                    // При свайпе сама карточка fpArtBox уже анимирует opacity/transform,
                    // поэтому обложку внутри меняем мгновенно без двойного наложения теней
                    nextCover.style.transition = 'none';
                    nextCover.classList.add('visible');
                    void nextCover.offsetWidth;
                    nextCover.style.transition = '';
                    hideLayerInstantly(prevCover);
                }

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        if (seq !== fpCoverSeq) return;
                        if (!instantCover) {
                            nextCover.classList.add('visible');
                        }
                        nextBg.classList.add('visible');
                        fpActiveLayer = nextIdx;
                        setTimeout(() => {
                            if (fpActiveLayer === nextIdx) {
                                if (!instantCover) hideLayerInstantly(prevCover);
                                hideLayerInstantly(prevBg);
                            }
                        }, 480);
                    });
                });
            };
            preload.onerror = () => {
                if (seq !== fpCoverSeq) return;
                hideLayerInstantly(prevCover);
                hideLayerInstantly(nextCover);
                hideLayerInstantly(prevBg);
                hideLayerInstantly(nextBg);
                fpCoverFallback.style.display = 'block';
            };
            preload.src = coverUrl;
        }

        playerTrackTrigger.addEventListener('click', openFullPlayer);
        fpCollapseBtn.addEventListener('click', () => {
            haptic('light');
            closeFullPlayer();
        });

        // Gestures in fullscreen player: 60fps GPU-accelerated vertical swipe-down to close & horizontal cover swipe to skip
        let swipeStartX = 0;
        let swipeStartY = 0;
        let swipeStartTime = 0;
        let swipeDeltaX = 0;
        let swipeDeltaY = 0;
        let swipeMode = null; // 'vertical' | 'horizontal' | null
        let swipeStartedOnArt = false;
        let swipeActive = false;
        let swipeRafId = null;

        function renderSwipeFrame() {
            swipeRafId = null;
            if (!swipeActive) return;
            if (swipeMode === 'horizontal') {
                const clampedX = Math.max(-220, Math.min(220, swipeDeltaX));
                const rot = clampedX * 0.032;
                const op = Math.max(0.35, 1 - Math.abs(clampedX) / 300);
                const baseScale = audio.paused ? 0.92 : 1;
                fpArtBox.style.transform = `translate3d(${clampedX}px, 0, 0) rotate(${rot}deg) scale(${baseScale})`;
                fpArtBox.style.opacity = `${op}`;
            } else if (swipeMode === 'vertical') {
                const dy = Math.max(0, swipeDeltaY);
                fullPlayer.style.transform = `translate3d(0, ${dy}px, 0)`;
            }
        }

        let nextCoverInstant = false;

        function animateArtSwipeChange(direction) {
            // direction: -1 (swipe left -> next track), +1 (swipe right -> prev track)
            const baseScale = audio.paused ? 0.92 : 1;
            fpArtBox.classList.remove('swiping');
            fpArtBox.classList.add('swipe-out');
            fpArtBox.style.transform = `translate3d(${direction * 115}%, 0, 0) rotate(${direction * 6}deg) scale(${baseScale * 0.95})`;
            fpArtBox.style.opacity = '0';

            setTimeout(() => {
                nextCoverInstant = true;
                if (direction < 0) {
                    playNextTrack();
                } else {
                    playPrevTrack();
                }
                nextCoverInstant = false;

                fpArtBox.classList.remove('swipe-out');
                fpArtBox.classList.add('swiping');
                fpArtBox.style.transform = `translate3d(${-direction * 46}px, 0, 0) scale(0.93)`;
                fpArtBox.style.opacity = '0';
                void fpArtBox.offsetWidth;
                fpArtBox.classList.remove('swiping');
                fpArtBox.style.transform = '';
                fpArtBox.style.opacity = '';
            }, 170);
        }

        fullPlayer.addEventListener('touchstart', (e) => {
            if (!isFullPlayerOpen || e.touches.length !== 1) return;
            if (e.target.closest('.seek-wrapper') || e.target.closest('button')) return;
            swipeStartX = e.touches[0].clientX;
            swipeStartY = e.touches[0].clientY;
            swipeStartTime = Date.now();
            swipeDeltaX = 0;
            swipeDeltaY = 0;
            swipeMode = null;
            swipeStartedOnArt = Boolean(e.target.closest('#fpArtBox'));
            swipeActive = true;
        }, { passive: true });

        fullPlayer.addEventListener('touchmove', (e) => {
            if (!swipeActive) return;
            const dx = e.touches[0].clientX - swipeStartX;
            const dy = e.touches[0].clientY - swipeStartY;

            if (!swipeMode) {
                if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
                if (swipeStartedOnArt && Math.abs(dx) > Math.abs(dy)) {
                    swipeMode = 'horizontal';
                    fpArtBox.classList.remove('swipe-out');
                    fpArtBox.classList.add('swiping');
                } else {
                    swipeMode = 'vertical';
                    fullPlayer.classList.add('dragging');
                }
            }

            if (swipeMode === 'horizontal') {
                if (e.cancelable) e.preventDefault();
                swipeDeltaX = dx;
            } else if (swipeMode === 'vertical') {
                swipeDeltaY = Math.max(0, dy);
            }

            if (swipeRafId === null) {
                swipeRafId = requestAnimationFrame(renderSwipeFrame);
            }
        }, { passive: false });

        function endFullPlayerSwipe() {
            if (!swipeActive) return;
            swipeActive = false;
            if (swipeRafId !== null) {
                cancelAnimationFrame(swipeRafId);
                swipeRafId = null;
            }
            const elapsed = Math.max(1, Date.now() - swipeStartTime);

            if (swipeMode === 'horizontal') {
                const vx = Math.abs(swipeDeltaX) / elapsed;
                if (Math.abs(swipeDeltaX) > 65 || vx > 0.45) {
                    haptic('light');
                    animateArtSwipeChange(swipeDeltaX < 0 ? -1 : 1);
                } else {
                    fpArtBox.classList.remove('swiping', 'swipe-out');
                    fpArtBox.style.transform = '';
                    fpArtBox.style.opacity = '';
                }
            } else if (swipeMode === 'vertical') {
                fullPlayer.classList.remove('dragging');
                const vy = swipeDeltaY / elapsed;
                if (swipeDeltaY > 90 || vy > 0.55) {
                    closeFullPlayer();
                } else {
                    fullPlayer.style.transform = '';
                }
            }
            swipeMode = null;
        }

        fullPlayer.addEventListener('touchend', endFullPlayerSwipe);
        fullPlayer.addEventListener('touchcancel', endFullPlayerSwipe);

        function scrollToActiveTrack() {
            if (isFullPlayerOpen) return;
            requestAnimationFrame(() => {
                const activeItem = trackListEl.querySelector('.track-item.active');
                if (!activeItem) return;

                const headerH = headerEl ? headerEl.offsetHeight : 0;
                const playerH = playerBar.classList.contains('visible') ? playerBar.offsetHeight : 0;
                const visibleHeight = Math.max(120, window.innerHeight - headerH - playerH);

                const rect = activeItem.getBoundingClientRect();
                const currentScrollY = window.scrollY || document.documentElement.scrollTop || 0;
                const itemAbsTop = rect.top + currentScrollY;

                // Центрируем активный трек в видимой области между шапкой и нижним плеером
                const targetTop = Math.max(0, itemAbsTop - headerH - (visibleHeight - rect.height) / 2);
                window.scrollTo({ top: targetTop, behavior: 'smooth' });
            });
        }

        let scrollTicking = false;
        window.addEventListener('scroll', () => {
            if (scrollTicking) return;
            scrollTicking = true;
            requestAnimationFrame(() => {
                const y = window.scrollY || document.documentElement.scrollTop || 0;
                headerEl.classList.toggle('scrolled', y > 12);
                scrollTopBtn.classList.toggle('visible', y > 280);
                scrollTicking = false;
            });
        }, { passive: true });

        scrollTopBtn.addEventListener('click', () => {
            haptic('light');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function playTrackById(fileId, shouldScroll = false) {
            const track = filteredTracks.find(t => t.file_id === fileId) || allTracks.find(t => t.file_id === fileId);
            if (!track) return;
            currentFileId = track.file_id;

            const titleText = track.title || track.name;
            const artistText = track.performer || 'Spotify';

            playerBar.classList.add('visible');
            document.body.classList.add('has-player');
            setMarqueeText(playerTitle, titleText);
            playerArtist.textContent = artistText;

            playerCover.style.visibility = 'visible';
            playerCover.src = track.cover_url;

            setMarqueeText(fpTitle, titleText);
            setMarqueeText(fpArtist, artistText);
            crossfadeFullPlayerCover(track.cover_url, nextCoverInstant);

            seekSlider.value = 0;
            fpSeekSlider.value = 0;
            setProgressVisual(0, 0);

            audio.src = track.stream_url;
            audio.play().catch(() => {});
            updatePlayButtons(true);
            renderTracks();
            if (shouldScroll) {
                scrollToActiveTrack();
            }

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: titleText,
                    artist: artistText,
                    artwork: [{ src: track.cover_url, sizes: '512x512', type: 'image/jpeg' }]
                });
            }
        }

        function playPrevTrack() {
            const order = getActiveOrderIds();
            if (order.length === 0) return;
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }
            const idx = order.indexOf(currentFileId);
            const prevIdx = idx === -1 ? order.length - 1 : (idx - 1 + order.length) % order.length;
            playTrackById(order[prevIdx], true);
        }

        function playNextTrack() {
            const order = getActiveOrderIds();
            if (order.length === 0) return;
            const idx = order.indexOf(currentFileId);
            const nextIdx = idx === -1 ? 0 : (idx + 1) % order.length;
            playTrackById(order[nextIdx], true);
        }

        function togglePlayPause() {
            haptic('light');
            if (!currentFileId && filteredTracks.length > 0) {
                playTrackById(filteredTracks[0].file_id);
                return;
            }
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function toggleRepeat() {
            haptic('light');
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active-mode', isRepeat);
            fpRepeatBtn.classList.toggle('active-mode', isRepeat);
        }

        function toggleShuffle() {
            haptic('light');
            isShuffle = !isShuffle;
            fpShuffleBtn.classList.toggle('active-mode', isShuffle);
            if (isShuffle) {
                rebuildShuffleQueue();
            }
        }

        function updatePlayButtons(playing) {
            playIcon.style.display = playing ? 'none' : 'block';
            pauseIcon.style.display = playing ? 'block' : 'none';
            fpPlayIcon.style.display = playing ? 'none' : 'block';
            fpPauseIcon.style.display = playing ? 'block' : 'none';
            fpArtBox.classList.toggle('playing', playing);
            fpPlayPauseBtn.classList.toggle('is-playing', playing);
            document.querySelectorAll('.eq-overlay').forEach(el => {
                el.classList.toggle('paused', !playing);
            });
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
            }
        }

        if ('mediaSession' in navigator) {
            const setHandler = (action, fn) => {
                try {
                    navigator.mediaSession.setActionHandler(action, fn);
                } catch (e) {}
            };
            setHandler('play', () => {
                if (!currentFileId && filteredTracks.length > 0) {
                    playTrackById(filteredTracks[0].file_id);
                } else {
                    audio.play().catch(() => {});
                }
            });
            setHandler('pause', () => audio.pause());
            setHandler('previoustrack', playPrevTrack);
            setHandler('nexttrack', playNextTrack);
            setHandler('seekto', (details) => {
                if (details && typeof details.seekTime === 'number' && !isNaN(audio.duration)) {
                    audio.currentTime = Math.max(0, Math.min(details.seekTime, audio.duration));
                }
            });
        }

        playPauseBtn.addEventListener('click', togglePlayPause);
        fpPlayPauseBtn.addEventListener('click', togglePlayPause);

        prevBtn.addEventListener('click', () => { haptic('light'); playPrevTrack(); });
        fpPrevBtn.addEventListener('click', () => { haptic('light'); playPrevTrack(); });
        nextBtn.addEventListener('click', () => { haptic('light'); playNextTrack(); });
        fpNextBtn.addEventListener('click', () => { haptic('light'); playNextTrack(); });

        repeatBtn.addEventListener('click', toggleRepeat);
        fpRepeatBtn.addEventListener('click', toggleRepeat);
        fpShuffleBtn.addEventListener('click', toggleShuffle);

        audio.addEventListener('play', () => {
            updatePlayButtons(true);
            startProgressLoop();
        });
        audio.addEventListener('pause', () => {
            updatePlayButtons(false);
            stopProgressLoop();
        });
        audio.addEventListener('loadedmetadata', () => {
            setProgressVisual(audio.currentTime || 0, audio.duration || 0);
        });
        audio.addEventListener('seeked', () => {
            if (!isSeeking) {
                setProgressVisual(audio.currentTime || 0, audio.duration || 0);
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (isSeeking) return;
            setProgressVisual(audio.currentTime || 0, audio.duration || 0);
        });

        audio.addEventListener('ended', () => {
            stopProgressLoop();
            if (isRepeat) {
                audio.currentTime = 0;
                setProgressVisual(0, audio.duration || 0);
                audio.play();
            } else if (filteredTracks.length > 0) {
                playNextTrack();
            }
        });

        function bindSeekSlider(sliderEl, wrapperEl) {
            sliderEl.addEventListener('input', () => {
                isSeeking = true;
                wrapperEl.classList.add('seeking');
                const val = parseFloat(sliderEl.value) || 0;
                setProgressVisual(val, audio.duration || parseFloat(sliderEl.max) || 0);
            });

            sliderEl.addEventListener('change', () => {
                const val = parseFloat(sliderEl.value) || 0;
                audio.currentTime = val;
                isSeeking = false;
                wrapperEl.classList.remove('seeking');
                setProgressVisual(val, audio.duration || 0);
            });
        }

        bindSeekSlider(seekSlider, seekWrapper);
        bindSeekSlider(fpSeekSlider, fpSeekWrapper);

        function applySearchFilter(options = {}) {
            const q = searchInput.value.trim().toLowerCase();
            filteredTracks = allTracks.filter(t =>
                (t.title && t.title.toLowerCase().includes(q)) ||
                (t.performer && t.performer.toLowerCase().includes(q)) ||
                (t.name && t.name.toLowerCase().includes(q))
            );
            renderTracks(options);
        }

        searchInput.addEventListener('input', () => applySearchFilter());

        async function sendToChat(fileId) {
            try {
                const res = await fetch(`/api/send_track?file_id=${encodeURIComponent(fileId)}`, {
                    method: 'POST',
                    headers: authHeaders()
                });
                if (res.ok && tg.showPopup) {
                    tg.showPopup({ message: 'Трек отправлен в чат с ботом! 🎧' });
                }
            } catch (e) {}
        }

        function commitServerDelete(fileId, keepalive = false) {
            fetch(`/api/playlist?file_id=${encodeURIComponent(fileId)}`, {
                method: 'DELETE',
                headers: authHeaders(),
                keepalive
            }).catch(() => {});
        }

        function flushPendingDelete(keepalive = false) {
            if (!pendingDelete) return;
            clearTimeout(pendingDelete.timer);
            const fileId = pendingDelete.track.file_id;
            pendingDelete = null;
            undoToast.classList.remove('visible');
            commitServerDelete(fileId, keepalive);
        }

        function showUndoToast(track) {
            undoToastText.textContent = `Удалён: ${track.title || track.name}`;
            undoToast.classList.add('visible');
        }

        undoDeleteBtn.addEventListener('click', () => {
            if (!pendingDelete) return;
            haptic('light');
            clearTimeout(pendingDelete.timer);
            const { track, allIndex } = pendingDelete;
            pendingDelete = null;
            undoToast.classList.remove('visible');

            const insertAt = Math.min(allIndex, allTracks.length);
            allTracks.splice(insertAt, 0, track);
            if (isShuffle) rebuildShuffleQueue();
            applySearchFilter({ highlightFileId: track.file_id });
        });

        window.addEventListener('pagehide', () => flushPendingDelete(true));

        function finalizeDeleteUI(fileId) {
            const allIndex = allTracks.findIndex(t => t.file_id === fileId);
            if (allIndex === -1) return;
            const track = allTracks[allIndex];

            const wasCurrent = currentFileId === fileId;
            allTracks.splice(allIndex, 1);
            filteredTracks = filteredTracks.filter(t => t.file_id !== fileId);
            shuffledIds = shuffledIds.filter(id => id !== fileId);

            if (wasCurrent) {
                if (filteredTracks.length > 0) {
                    playNextTrack();
                } else {
                    audio.pause();
                    audio.src = '';
                    currentFileId = null;
                    closeFullPlayer();
                    playerBar.classList.remove('visible');
                    document.body.classList.remove('has-player');
                }
            }
            renderTracks();

            showUndoToast(track);
            const timer = setTimeout(() => {
                if (pendingDelete && pendingDelete.track.file_id === fileId) {
                    pendingDelete = null;
                    undoToast.classList.remove('visible');
                    commitServerDelete(fileId, false);
                }
            }, 5000);

            pendingDelete = { track, allIndex, timer };
        }

        function deleteTrack(fileId) {
            // Если есть предыдущее отложенное удаление — сразу подтверждаем его на сервере
            flushPendingDelete(false);

            const exists = allTracks.some(t => t.file_id === fileId);
            if (!exists) return;

            haptic('medium');
            const itemEl = Array.from(trackListEl.children).find(
                el => el.dataset && el.dataset.fileId === fileId
            );
            if (itemEl && !itemEl.classList.contains('removing')) {
                itemEl.style.maxHeight = `${itemEl.offsetHeight}px`;
                requestAnimationFrame(() => {
                    itemEl.classList.add('removing');
                });
                setTimeout(() => finalizeDeleteUI(fileId), 220);
            } else {
                finalizeDeleteUI(fileId);
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[s]));
        }

        loadPlaylist();
    </script>
</body>
