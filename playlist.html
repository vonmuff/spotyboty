<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой плейлист</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0f0f13;
            --bg-card: #18181f;
            --bg-card-hover: #22222c;
            --accent: #1db954;
            --accent-hover: #1ed760;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 155px;
            min-height: 100vh;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(15, 15, 19, 0.88);
            backdrop-filter: blur(14px);
            padding: 16px 16px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .track-counter {
            font-size: 13px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 99px;
        }

        .search-box {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent);
        }

        .track-list {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            border: 1px solid transparent;
        }

        .track-item:active {
            transform: scale(0.99);
        }

        .track-item.active {
            background: rgba(29, 185, 84, 0.12);
            border-color: rgba(29, 185, 84, 0.4);
        }

        .cover-wrapper {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            background: linear-gradient(135deg, #2b2b36, #18181f);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-fallback {
            font-size: 22px;
            user-select: none;
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .track-item.active .track-title {
            color: var(--accent);
        }

        .track-artist {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: var(--text-secondary);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }

        .icon-btn.delete:hover {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-secondary);
        }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(24, 24, 31, 0.96);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px 18px;
            z-index: 20;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.45);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .player-bar.visible {
            transform: translateY(0);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .time-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            min-width: 34px;
        }

        .time-label:last-child {
            text-align: right;
        }

        .seek-wrapper {
            position: relative;
            flex: 1;
            height: 24px;
            display: flex;
            align-items: center;
            touch-action: none;
        }

        .seek-track {
            position: relative;
            width: 100%;
            height: 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            overflow: hidden;
            transition: height 0.15s ease;
        }

        .seek-wrapper:hover .seek-track,
        .seek-wrapper.seeking .seek-track {
            height: 7px;
        }

        .seek-fill {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            box-shadow: 0 0 8px rgba(29, 185, 84, 0.45);
            will-change: width;
        }

        .seek-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
            transform: translate(-50%, -50%) scale(0.85);
            pointer-events: none;
            transition: transform 0.15s ease;
            will-change: left;
        }

        .seek-wrapper:hover .seek-thumb,
        .seek-wrapper.seeking .seek-thumb {
            transform: translate(-50%, -50%) scale(1.15);
        }

        .seek-slider {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            opacity: 0;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .player-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .player-track {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .player-cover {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            background: #2b2b36;
            flex-shrink: 0;
        }

        .player-meta {
            min-width: 0;
            flex: 1;
        }

        .player-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .ctrl-btn.play-pause {
            background: var(--accent);
            color: #000;
            width: 44px;
            height: 44px;
        }

        .ctrl-btn.active-mode {
            color: var(--accent);
        }

        .player-track {
            cursor: pointer;
        }

        /* ===== Fullscreen Player (Bottom Sheet) ===== */
        body.fp-open {
            overflow: hidden;
        }

        .full-player {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 12px) 24px calc(env(safe-area-inset-bottom, 16px) + 18px);
            transform: translateY(100%);
            transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            overflow: hidden;
            touch-action: pan-x;
        }

        .full-player.open {
            transform: translateY(0);
        }

        .full-player.dragging {
            transition: none;
        }

        .fp-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 50% 25%, #232333 0%, #0f0f13 75%);
        }

        .fp-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(55px) saturate(1.65) brightness(0.42);
            transform: scale(1.28);
            opacity: 0;
            transition: opacity 0.45s ease;
        }

        .fp-bg-img.loaded {
            opacity: 1;
        }

        .fp-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(15, 15, 19, 0.35) 0%,
                rgba(15, 15, 19, 0.55) 55%,
                rgba(15, 15, 19, 0.92) 100%
            );
        }

        .fp-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
        }

        .fp-handle {
            width: 40px;
            height: 4px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.28);
            margin: 6px auto 8px;
            flex-shrink: 0;
        }

        .fp-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .fp-collapse-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .fp-collapse-btn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .fp-header-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.72);
        }

        .fp-topbar-spacer {
            width: 38px;
        }

        .fp-art-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            padding: 8px 0 18px;
        }

        .fp-art-box {
            position: relative;
            width: min(78vw, 320px);
            max-height: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            background: linear-gradient(135deg, #2b2b38, #16161d);
            box-shadow: 0 22px 52px rgba(0, 0, 0, 0.58);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(0.92);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
        }

        .fp-art-box.playing {
            transform: scale(1);
            box-shadow: 0 26px 60px rgba(0, 0, 0, 0.68);
        }

        .fp-art-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .fp-art-fallback {
            font-size: 72px;
            user-select: none;
            display: none;
        }

        .fp-meta {
            margin-bottom: 18px;
        }

        .fp-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .fp-artist {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.72);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fp-progress {
            margin-bottom: 18px;
        }

        .fp-progress .seek-wrapper {
            height: 28px;
        }

        .fp-progress .seek-track {
            height: 6px;
        }

        .fp-progress .seek-wrapper:hover .seek-track,
        .fp-progress .seek-wrapper.seeking .seek-track {
            height: 8px;
        }

        .fp-progress .seek-thumb {
            width: 14px;
            height: 14px;
        }

        .fp-times {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
        }

        .fp-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .fp-ctrl-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s ease, color 0.2s ease, background 0.2s ease;
        }

        .fp-ctrl-btn:active {
            transform: scale(0.92);
        }

        .fp-ctrl-btn.active-mode {
            color: var(--accent);
        }

        .fp-ctrl-btn.play-pause {
            width: 66px;
            height: 66px;
            background: var(--accent);
            color: #000;
            box-shadow: 0 8px 26px rgba(29, 185, 84, 0.42);
        }

        .fp-ctrl-btn.play-pause:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <h1>🎵 Мой плейлист</h1>
            <span class="track-counter" id="trackCount">0 треков</span>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="Поиск по названию или автору...">
    </div>

    <div id="trackList" class="track-list">
        <div class="empty-state">Загрузка плейлиста...</div>
    </div>

    <div id="playerBar" class="player-bar">
        <div class="progress-container">
            <span id="currentTime" class="time-label">0:00</span>
            <div id="seekWrapper" class="seek-wrapper">
                <div class="seek-track">
                    <div id="seekFill" class="seek-fill"></div>
                </div>
                <div id="seekThumb" class="seek-thumb"></div>
                <input type="range" id="seekSlider" class="seek-slider" min="0" max="100" value="0" step="0.01">
            </div>
            <span id="totalTime" class="time-label">0:00</span>
        </div>
        <div class="player-main">
            <div class="player-track" id="playerTrackTrigger" title="Открыть плеер">
                <img id="playerCover" class="player-cover" src="" alt="" onerror="this.style.visibility='hidden'">
                <div class="player-meta">
                    <div id="playerTitle" class="player-title">Выберите трек</div>
                    <div id="playerArtist" class="player-artist">—</div>
                </div>
            </div>
            <div class="player-controls">
                <button class="ctrl-btn" id="prevBtn" title="Предыдущий">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn play-pause" id="playPauseBtn" title="Воспроизвести / Пауза">
                    <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="ctrl-btn" id="nextBtn" title="Следующий">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button class="ctrl-btn" id="repeatBtn" title="Повтор трека">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="fullPlayer" class="full-player" aria-hidden="true">
        <div class="fp-bg">
            <img id="fpBgImg" class="fp-bg-img" src="" alt="">
        </div>
        <div class="fp-content">
            <div>
                <div class="fp-handle"></div>
                <div class="fp-topbar">
                    <button class="fp-collapse-btn" id="fpCollapseBtn" title="Свернуть">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
                    </button>
                    <span class="fp-header-label">Сейчас играет</span>
                    <div class="fp-topbar-spacer"></div>
                </div>
            </div>

            <div class="fp-art-wrap">
                <div id="fpArtBox" class="fp-art-box">
                    <img id="fpCover" src="" alt="">
                    <span id="fpCoverFallback" class="fp-art-fallback">🎵</span>
                </div>
            </div>

            <div>
                <div class="fp-meta">
                    <div id="fpTitle" class="fp-title">Выберите трек</div>
                    <div id="fpArtist" class="fp-artist">—</div>
                </div>

                <div class="fp-progress">
                    <div id="fpSeekWrapper" class="seek-wrapper">
                        <div class="seek-track">
                            <div id="fpSeekFill" class="seek-fill"></div>
                        </div>
                        <div id="fpSeekThumb" class="seek-thumb"></div>
                        <input type="range" id="fpSeekSlider" class="seek-slider" min="0" max="100" value="0" step="0.01">
                    </div>
                    <div class="fp-times">
                        <span id="fpCurrentTime" class="time-label">0:00</span>
                        <span id="fpTotalTime" class="time-label">0:00</span>
                    </div>
                </div>

                <div class="fp-controls">
                    <button class="fp-ctrl-btn" id="fpShuffleBtn" title="Перемешать">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                    </button>
                    <button class="fp-ctrl-btn" id="fpPrevBtn" title="Предыдущий">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="fp-ctrl-btn play-pause" id="fpPlayPauseBtn" title="Воспроизвести / Пауза">
                        <svg id="fpPlayIcon" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="fpPauseIcon" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="fp-ctrl-btn" id="fpNextBtn" title="Следующий">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                    <button class="fp-ctrl-btn" id="fpRepeatBtn" title="Повтор трека">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioElement" preload="metadata"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const initData = tg.initData || '';
        const authHeaders = () => ({ 'X-Telegram-Init-Data': initData });

        let allTracks = [];
        let filteredTracks = [];
        let shuffledIds = [];
        let currentFileId = null;
        let isRepeat = false;
        let isShuffle = false;
        let isSeeking = false;
        let isFullPlayerOpen = false;

        function haptic(style = 'light') {
            try {
                tg.HapticFeedback?.impactOccurred(style);
            } catch (e) {}
        }

        function rebuildShuffleQueue() {
            const ids = filteredTracks.map(t => t.file_id);
            for (let i = ids.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [ids[i], ids[j]] = [ids[j], ids[i]];
            }
            if (currentFileId) {
                const idx = ids.indexOf(currentFileId);
                if (idx > 0) {
                    ids.splice(idx, 1);
                    ids.unshift(currentFileId);
                }
            }
            shuffledIds = ids;
        }

        function getActiveOrderIds() {
            if (isShuffle) {
                const validSet = new Set(filteredTracks.map(t => t.file_id));
                const cleaned = shuffledIds.filter(id => validSet.has(id));
                if (cleaned.length !== filteredTracks.length) {
                    rebuildShuffleQueue();
                    return shuffledIds;
                }
                return cleaned;
            }
            return filteredTracks.map(t => t.file_id);
        }

        function getCurrentIndex() {
            if (!currentFileId) return -1;
            return getActiveOrderIds().indexOf(currentFileId);
        }

        const audio = document.getElementById('audioElement');
        const trackListEl = document.getElementById('trackList');
        const trackCountEl = document.getElementById('trackCount');
        const searchInput = document.getElementById('searchInput');
        const playerBar = document.getElementById('playerBar');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const playerCover = document.getElementById('playerCover');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const playerTrackTrigger = document.getElementById('playerTrackTrigger');
        const seekWrapper = document.getElementById('seekWrapper');
        const seekFill = document.getElementById('seekFill');
        const seekThumb = document.getElementById('seekThumb');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');

        const fullPlayer = document.getElementById('fullPlayer');
        const fpBgImg = document.getElementById('fpBgImg');
        const fpCollapseBtn = document.getElementById('fpCollapseBtn');
        const fpArtBox = document.getElementById('fpArtBox');
        const fpCover = document.getElementById('fpCover');
        const fpCoverFallback = document.getElementById('fpCoverFallback');
        const fpTitle = document.getElementById('fpTitle');
        const fpArtist = document.getElementById('fpArtist');
        const fpSeekWrapper = document.getElementById('fpSeekWrapper');
        const fpSeekFill = document.getElementById('fpSeekFill');
        const fpSeekThumb = document.getElementById('fpSeekThumb');
        const fpSeekSlider = document.getElementById('fpSeekSlider');
        const fpCurrentTime = document.getElementById('fpCurrentTime');
        const fpTotalTime = document.getElementById('fpTotalTime');
        const fpShuffleBtn = document.getElementById('fpShuffleBtn');
        const fpPrevBtn = document.getElementById('fpPrevBtn');
        const fpPlayPauseBtn = document.getElementById('fpPlayPauseBtn');
        const fpPlayIcon = document.getElementById('fpPlayIcon');
        const fpPauseIcon = document.getElementById('fpPauseIcon');
        const fpNextBtn = document.getElementById('fpNextBtn');
        const fpRepeatBtn = document.getElementById('fpRepeatBtn');

        let progressRafId = null;

        function setProgressVisual(current, duration) {
            const pct = duration > 0 ? Math.max(0, Math.min(100, (current / duration) * 100)) : 0;
            const formattedCurrent = formatTime(current);
            const formattedTotal = duration > 0 ? formatTime(duration) : '0:00';

            seekFill.style.width = `${pct}%`;
            seekThumb.style.left = `${pct}%`;
            currentTimeEl.textContent = formattedCurrent;
            totalTimeEl.textContent = formattedTotal;

            fpSeekFill.style.width = `${pct}%`;
            fpSeekThumb.style.left = `${pct}%`;
            fpCurrentTime.textContent = formattedCurrent;
            fpTotalTime.textContent = formattedTotal;

            if (duration > 0) {
                seekSlider.max = duration;
                fpSeekSlider.max = duration;
                if (!isSeeking) {
                    seekSlider.value = current;
                    fpSeekSlider.value = current;
                }
            }
        }

        function startProgressLoop() {
            if (progressRafId !== null) return;
            const tick = () => {
                if (!isSeeking && !audio.paused && audio.duration) {
                    setProgressVisual(audio.currentTime, audio.duration);
                }
                if (!audio.paused) {
                    progressRafId = requestAnimationFrame(tick);
                } else {
                    progressRafId = null;
                }
            };
            progressRafId = requestAnimationFrame(tick);
        }

        function stopProgressLoop() {
            if (progressRafId !== null) {
                cancelAnimationFrame(progressRafId);
                progressRafId = null;
            }
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        async function loadPlaylist() {
            if (!initData) {
                trackListEl.innerHTML = `<div class="empty-state">Откройте плейлист через кнопку в Telegram-боте.</div>`;
                return;
            }
            try {
                const res = await fetch('/api/playlist', { headers: authHeaders() });
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }
                const data = await res.json();
                allTracks = data.tracks || [];
                filteredTracks = [...allTracks];
                renderTracks();
            } catch (err) {
                trackListEl.innerHTML = `<div class="empty-state">Ошибка загрузки плейлиста</div>`;
            }
        }

        function renderTracks() {
            trackCountEl.textContent = `${allTracks.length} треков`;

            if (filteredTracks.length === 0) {
                trackListEl.innerHTML = `<div class="empty-state">Плейлист пуст 🎧</div>`;
                return;
            }

            trackListEl.innerHTML = '';
            filteredTracks.forEach((track) => {
                const isCurrent = currentFileId !== null && currentFileId === track.file_id;
                const item = document.createElement('div');
                item.className = `track-item ${isCurrent ? 'active' : ''}`;

                const coverUrl = track.cover_url;

                item.innerHTML = `
                    <div class="cover-wrapper">
                        <img src="${coverUrl}" alt="" loading="lazy"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <span class="cover-fallback" style="display:none;">🎵</span>
                    </div>
                    <div class="track-info">
                        <div class="track-title">${escapeHtml(track.title || track.name)}</div>
                        <div class="track-artist">${escapeHtml(track.performer || 'Spotify')}</div>
                    </div>
                    <div class="track-actions">
                        <button class="icon-btn" title="Отправить в чат" data-action="send">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </button>
                        <button class="icon-btn delete" title="Удалить" data-action="delete">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                `;

                item.addEventListener('click', (e) => {
                    const btn = e.target.closest('button');
                    if (btn) {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                        if (action === 'send') sendToChat(track.file_id);
                        if (action === 'delete') deleteTrack(track.file_id);
                        return;
                    }
                    playTrackById(track.file_id);
                });

                trackListEl.appendChild(item);
            });
        }

        function openFullPlayer() {
            if (!currentFileId) return;
            isFullPlayerOpen = true;
            fullPlayer.style.transform = '';
            fullPlayer.classList.add('open');
            fullPlayer.setAttribute('aria-hidden', 'false');
            document.body.classList.add('fp-open');
            haptic('light');
            try {
                tg.BackButton?.show();
            } catch (e) {}
        }

        function closeFullPlayer() {
            if (!isFullPlayerOpen) return;
            isFullPlayerOpen = false;
            fullPlayer.style.transform = '';
            fullPlayer.classList.remove('open', 'dragging');
            fullPlayer.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('fp-open');
            try {
                tg.BackButton?.hide();
            } catch (e) {}
        }

        try {
            tg.BackButton?.onClick(() => {
                if (isFullPlayerOpen) closeFullPlayer();
            });
        } catch (e) {}

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isFullPlayerOpen) {
                closeFullPlayer();
            }
        });

        fpCover.addEventListener('load', () => {
            fpCover.style.display = 'block';
            fpCoverFallback.style.display = 'none';
        });
        fpCover.addEventListener('error', () => {
            fpCover.style.display = 'none';
            fpCoverFallback.style.display = 'block';
        });
        fpBgImg.addEventListener('load', () => fpBgImg.classList.add('loaded'));
        fpBgImg.addEventListener('error', () => fpBgImg.classList.remove('loaded'));

        playerTrackTrigger.addEventListener('click', openFullPlayer);
        fpCollapseBtn.addEventListener('click', () => {
            haptic('light');
            closeFullPlayer();
        });

        // Swipe-down gesture to collapse fullscreen player
        let swipeStartY = 0;
        let swipeStartTime = 0;
        let swipeDeltaY = 0;
        let swipeActive = false;

        fullPlayer.addEventListener('touchstart', (e) => {
            if (!isFullPlayerOpen || e.touches.length !== 1) return;
            if (e.target.closest('.seek-wrapper') || e.target.closest('button')) return;
            swipeStartY = e.touches[0].clientY;
            swipeStartTime = Date.now();
            swipeDeltaY = 0;
            swipeActive = true;
            fullPlayer.classList.add('dragging');
        }, { passive: true });

        fullPlayer.addEventListener('touchmove', (e) => {
            if (!swipeActive) return;
            const dy = e.touches[0].clientY - swipeStartY;
            if (dy > 0) {
                swipeDeltaY = dy;
                fullPlayer.style.transform = `translateY(${dy}px)`;
            } else {
                swipeDeltaY = 0;
                fullPlayer.style.transform = 'translateY(0)';
            }
        }, { passive: true });

        fullPlayer.addEventListener('touchend', () => {
            if (!swipeActive) return;
            swipeActive = false;
            fullPlayer.classList.remove('dragging');
            const velocity = swipeDeltaY / Math.max(1, Date.now() - swipeStartTime);
            if (swipeDeltaY > 90 || velocity > 0.55) {
                closeFullPlayer();
            } else {
                fullPlayer.style.transform = '';
            }
        });

        function playTrackById(fileId) {
            const track = filteredTracks.find(t => t.file_id === fileId) || allTracks.find(t => t.file_id === fileId);
            if (!track) return;
            currentFileId = track.file_id;

            const titleText = track.title || track.name;
            const artistText = track.performer || 'Spotify';

            playerBar.classList.add('visible');
            playerTitle.textContent = titleText;
            playerArtist.textContent = artistText;

            playerCover.style.visibility = 'visible';
            playerCover.src = track.cover_url;

            fpTitle.textContent = titleText;
            fpArtist.textContent = artistText;
            fpCover.style.display = 'block';
            fpCoverFallback.style.display = 'none';
            fpCover.src = track.cover_url;
            fpBgImg.classList.remove('loaded');
            fpBgImg.src = track.cover_url;

            seekSlider.value = 0;
            fpSeekSlider.value = 0;
            setProgressVisual(0, 0);

            audio.src = track.stream_url;
            audio.play().catch(() => {});
            updatePlayButtons(true);
            renderTracks();

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: titleText,
                    artist: artistText,
                    artwork: [{ src: track.cover_url, sizes: '512x512', type: 'image/jpeg' }]
                });
            }
        }

        function playPrevTrack() {
            const order = getActiveOrderIds();
            if (order.length === 0) return;
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }
            const idx = order.indexOf(currentFileId);
            const prevIdx = idx === -1 ? order.length - 1 : (idx - 1 + order.length) % order.length;
            playTrackById(order[prevIdx]);
        }

        function playNextTrack() {
            const order = getActiveOrderIds();
            if (order.length === 0) return;
            const idx = order.indexOf(currentFileId);
            const nextIdx = idx === -1 ? 0 : (idx + 1) % order.length;
            playTrackById(order[nextIdx]);
        }

        function togglePlayPause() {
            haptic('light');
            if (!currentFileId && filteredTracks.length > 0) {
                playTrackById(filteredTracks[0].file_id);
                return;
            }
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function toggleRepeat() {
            haptic('light');
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active-mode', isRepeat);
            fpRepeatBtn.classList.toggle('active-mode', isRepeat);
        }

        function toggleShuffle() {
            haptic('light');
            isShuffle = !isShuffle;
            fpShuffleBtn.classList.toggle('active-mode', isShuffle);
            if (isShuffle) {
                rebuildShuffleQueue();
            }
        }

        function updatePlayButtons(playing) {
            playIcon.style.display = playing ? 'none' : 'block';
            pauseIcon.style.display = playing ? 'block' : 'none';
            fpPlayIcon.style.display = playing ? 'none' : 'block';
            fpPauseIcon.style.display = playing ? 'block' : 'none';
            fpArtBox.classList.toggle('playing', playing);
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
            }
        }

        if ('mediaSession' in navigator) {
            const setHandler = (action, fn) => {
                try {
                    navigator.mediaSession.setActionHandler(action, fn);
                } catch (e) {}
            };
            setHandler('play', () => {
                if (!currentFileId && filteredTracks.length > 0) {
                    playTrackById(filteredTracks[0].file_id);
                } else {
                    audio.play().catch(() => {});
                }
            });
            setHandler('pause', () => audio.pause());
            setHandler('previoustrack', playPrevTrack);
            setHandler('nexttrack', playNextTrack);
            setHandler('seekto', (details) => {
                if (details && typeof details.seekTime === 'number' && !isNaN(audio.duration)) {
                    audio.currentTime = Math.max(0, Math.min(details.seekTime, audio.duration));
                }
            });
        }

        playPauseBtn.addEventListener('click', togglePlayPause);
        fpPlayPauseBtn.addEventListener('click', togglePlayPause);

        prevBtn.addEventListener('click', () => { haptic('light'); playPrevTrack(); });
        fpPrevBtn.addEventListener('click', () => { haptic('light'); playPrevTrack(); });
        nextBtn.addEventListener('click', () => { haptic('light'); playNextTrack(); });
        fpNextBtn.addEventListener('click', () => { haptic('light'); playNextTrack(); });

        repeatBtn.addEventListener('click', toggleRepeat);
        fpRepeatBtn.addEventListener('click', toggleRepeat);
        fpShuffleBtn.addEventListener('click', toggleShuffle);

        audio.addEventListener('play', () => {
            updatePlayButtons(true);
            startProgressLoop();
        });
        audio.addEventListener('pause', () => {
            updatePlayButtons(false);
            stopProgressLoop();
        });
        audio.addEventListener('loadedmetadata', () => {
            setProgressVisual(audio.currentTime || 0, audio.duration || 0);
        });
        audio.addEventListener('seeked', () => {
            if (!isSeeking) {
                setProgressVisual(audio.currentTime || 0, audio.duration || 0);
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (isSeeking) return;
            setProgressVisual(audio.currentTime || 0, audio.duration || 0);
        });

        audio.addEventListener('ended', () => {
            stopProgressLoop();
            if (isRepeat) {
                audio.currentTime = 0;
                setProgressVisual(0, audio.duration || 0);
                audio.play();
            } else if (filteredTracks.length > 0) {
                playNextTrack();
            }
        });

        function bindSeekSlider(sliderEl, wrapperEl) {
            sliderEl.addEventListener('input', () => {
                isSeeking = true;
                wrapperEl.classList.add('seeking');
                const val = parseFloat(sliderEl.value) || 0;
                setProgressVisual(val, audio.duration || parseFloat(sliderEl.max) || 0);
            });

            sliderEl.addEventListener('change', () => {
                const val = parseFloat(sliderEl.value) || 0;
                audio.currentTime = val;
                isSeeking = false;
                wrapperEl.classList.remove('seeking');
                setProgressVisual(val, audio.duration || 0);
            });
        }

        bindSeekSlider(seekSlider, seekWrapper);
        bindSeekSlider(fpSeekSlider, fpSeekWrapper);

        searchInput.addEventListener('input', () => {
            const q = searchInput.value.trim().toLowerCase();
            filteredTracks = allTracks.filter(t =>
                (t.title && t.title.toLowerCase().includes(q)) ||
                (t.performer && t.performer.toLowerCase().includes(q)) ||
                (t.name && t.name.toLowerCase().includes(q))
            );
            renderTracks();
        });

        async function sendToChat(fileId) {
            try {
                const res = await fetch(`/api/send_track?file_id=${encodeURIComponent(fileId)}`, {
                    method: 'POST',
                    headers: authHeaders()
                });
                if (res.ok && tg.showPopup) {
                    tg.showPopup({ message: 'Трек отправлен в чат с ботом! 🎧' });
                }
            } catch (e) {}
        }

        async function deleteTrack(fileId) {
            try {
                const res = await fetch(`/api/playlist?file_id=${encodeURIComponent(fileId)}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                if (!res.ok) return;
                const wasCurrent = currentFileId === fileId;
                allTracks = allTracks.filter(t => t.file_id !== fileId);
                filteredTracks = filteredTracks.filter(t => t.file_id !== fileId);
                shuffledIds = shuffledIds.filter(id => id !== fileId);
                if (wasCurrent) {
                    if (filteredTracks.length > 0) {
                        playNextTrack();
                    } else {
                        audio.pause();
                        audio.src = '';
                        currentFileId = null;
                        closeFullPlayer();
                        playerBar.classList.remove('visible');
                    }
                }
                renderTracks();
            } catch (e) {}
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[s]));
        }

        loadPlaylist();
    </script>
</body>
</html>
