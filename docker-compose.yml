services:
  spotyboty:
    build: .
    container_name: spotyboty
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./blacklist.txt:/app/blacklist.txt:ro
      - ./top_songs.txt:/app/top_songs.txt:ro