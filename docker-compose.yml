services:
  spotyboty:
    build: .
    container_name: spotyboty
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./tracks_cache.db:/app/tracks_cache.db
      - ./covers_cache:/app/covers_cache
      - ./bot_log.jsonl:/app/bot_log.jsonl
      - ./blacklist.txt:/app/blacklist.txt
      - ./top_songs.txt:/app/top_songs.txt
      - ./cookies.txt:/app/cookies.txt